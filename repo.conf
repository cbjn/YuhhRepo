# ===== 软件源配置 =====
# 只需要改这个文件，其余内容由 build.py 自动生成。
# 格式：KEY=VALUE，# 开头为注释，值不要加引号。

# 源名称（Sileo 里显示的名字）
NAME=Yuhh Repo

# 源地址：你的自有域名，必须 https，结尾不要加斜杠
URL=https://repo.yuhh.win

# 一句话简介（显示在 Sileo 源信息和首页）
DESCRIPTION=Yuhh 的 iOS rootless 越狱软件源

# Release 文件头部信息
ORIGIN=Yuhh Repo
LABEL=Yuhh Repo
SUITE=stable
CODENAME=ios
VERSION=1.0

# 支持的架构（空格分隔）
#   iphoneos-arm      rootful（传统越狱）
#   iphoneos-arm64    rootless（Dopamine / palera1n 无根）  ← 当前使用
#   iphoneos-arm64e   roothide
# 以后要加 rootful/roothide 的包，把对应架构追加到这一行即可
ARCHITECTURES=iphoneos-arm64

COMPONENTS=main

# 是否保留同一个包的旧版本（1=保留，方便用户降级；0=只保留最新版）
KEEP_OLD_VERSIONS=1

# 页脚版权/联系方式（可留空）
FOOTER=
